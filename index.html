<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>FollowUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="brand"><img src="assets/logo-mark.svg" alt="" width="34" height="32"><span>Follow<span class="brand-up">Up</span></span></span>
    <div id="company" class="company" hidden>
      <button id="logo" class="company-logo" type="button" popovertarget="logo-menu" title="Logo aziendale" aria-label="Logo aziendale"></button>
      <div id="logo-menu" class="menu" popover>
        <button id="logo-pick" type="button" popovertarget="logo-menu" popovertargetaction="hide">Scegli immagine…</button>
        <button id="logo-remove" type="button" popovertarget="logo-menu" popovertargetaction="hide" hidden>Rimuovi logo</button>
      </div>
      <span><small>Azienda</small><strong id="company-name"></strong></span>
    </div>
    <div id="license" class="license-chip" hidden>
      <span class="ico i-calendar"></span>
      <span><strong id="license-days"></strong><small id="license-until"></small></span>
    </div>
    <label class="search">
      <span class="ico i-search"></span>
      <input id="search" type="search" placeholder="Cerca cliente o veicolo…" aria-label="Cerca cliente o veicolo" autocomplete="off" spellcheck="false">
    </label>
    <button id="renew" class="link" hidden>Rinnova</button>
    <button id="refresh" class="btn">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Aggiorna
    </button>
  </header>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span id="update-text"></span>
    <button id="update-now" class="btn btn-blue">Riavvia ora</button>
    <button id="update-later" class="btn">Più tardi</button>
  </div>

  <section id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-form" aria-labelledby="lock-title">
      <span class="lock-badge"><span class="ico i-shield"></span></span>
      <h1 id="lock-title">Benvenuto in Follow<span class="brand-up">Up</span></h1>
      <p class="muted">Incolla la chiave di licenza ricevuta per attivare FollowUp su questo PC.</p>
      <p id="lock-reason" class="lock-reason" hidden></p>
      <label class="field">
        <span><span class="ico i-key"></span>Chiave di licenza</span>
        <textarea id="key" rows="4" spellcheck="false" autocomplete="off" required></textarea>
      </label>
      <p id="lock-error" class="hint warn" role="alert" hidden></p>
      <button class="btn btn-confirm">Conferma</button>
      <button id="pick-db" type="button" class="link" hidden>Scegli l'archivio fatture</button>
      <button id="lock-close" type="button" class="link" hidden>Annulla</button>
    </form>
  </section>

  <div id="layout" class="layout">
    <nav class="months" aria-label="Mesi">
      <select id="year" aria-label="Anno"></select>
      <div id="months"></div>
    </nav>

    <main class="list">
      <div class="list-head">
        <h1><span class="ico i-calendar"></span><span id="title"></span></h1>
        <div id="summary" class="pills"></div>
      </div>
      <div class="range">
        <label>Dal giorno <select id="from"></select></label>
        <label>al <select id="to"></select></label>
        <button id="range-clear" class="btn" hidden><span class="ico i-rotate"></span>Tutto il mese</button>
      </div>
      <p id="empty" class="empty" hidden></p>
      <div id="table-box" class="table-box">
        <table>
          <thead>
            <tr><th data-sort="date"><button class="sort">Data</button></th><th data-sort="number"><button class="sort">Nº</button></th><th data-sort="client"><button class="sort">Cliente</button></th><th>Veicolo</th><th class="num" data-sort="total"><button class="sort">Totale</button></th><th data-sort="status"><button class="sort">Stato</button></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <aside id="detail" class="detail" aria-label="Fattura selezionata" hidden></aside>
  </div>

  <dialog id="tpl-dialog" class="tpl-dialog" aria-labelledby="tpl-title">
    <form method="dialog">
      <h2 id="tpl-title"></h2>
      <textarea id="tpl-text" class="message" rows="9" maxlength="1000" aria-labelledby="tpl-title" autofocus></textarea>
      <p class="hint">{cliente} {veicolo} {targa} {fattura} {data} {totale} si compilano da soli con i dati della fattura. Le parti tra [parentesi quadre] sostituiscile con i tuoi dati.</p>
      <div class="tpl-actions">
        <button id="tpl-reset" type="button" class="link">Ripristina il testo originale</button>
        <button class="btn" value="cancel">Annulla</button>
        <button class="btn btn-confirm" value="save">Salva</button>
      </div>
    </form>
  </dialog>

  <footer class="foot"><span id="status" class="status" role="status"></span><span class="foot-end"><button id="update" class="update" hidden></button><span id="version" class="version"></span></span></footer>

  <script src="renderer.js"></script>
</body>
</html>
