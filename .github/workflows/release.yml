name: release
on:
  push:
    tags: ['v*']
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # electron-builder uploads into v<package.json version>: any other tag would be published below as an empty Latest.
      - run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      # One draft up front: electron-builder uploads its files in parallel and, finding no release, makes one per file.
      - run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
      - run: npm run dist -- --publish always
      # Published only after every file is up, so the auto-updater never sees latest.yml before its installer.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
